name: CI build
on:
  push:
    paths-ignore:
      - 'documentation/**'
    branches: [ feature/Integrate-SonarCloud-analysis-into-GitHub-workflows ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Run shell function tests
        shell: bash
        run: bash cli/src/test/functions-test.sh
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build project with Maven
        run: mvn -B -ntp -Dstyle.color=always install
      - name: Sonarcloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=devonfw_devon4j
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.2.3
