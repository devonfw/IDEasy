name: Auto Assign PR Author

on:
  pull_request_target:
    types: [ opened, reopened, edited ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_AUTOMATIC_WORKFLOWS == 'true'

    steps:
      - name: Assign PR author to the PR and the linked issue(s)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Bot accounts cannot be assigned like regular contributors
            if (pr.user.type === 'Bot') {
              console.log(`PR author ${pr.user.login} is a bot. Skipping assignment.`);
              return;
            }
            if (pr.state !== 'open' || pr.labels?.some((label) => label.name === 'takeover')) {
              console.log(`PR #${pr.number} is closed or taken over. Skipping assignment.`);
              return;
            }

            // Issue(s) this PR closes, resolved by GitHub; only those in this repository.
            const issues = [];
            try {
              const { repository: repoData } = await github.graphql(
                `query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 10) {
                        nodes {
                          number
                          assignees(first: 10) { nodes { login } }
                          repository { owner { login } name }
                        }
                      }
                    }
                  }
                }`,
                { owner: context.repo.owner, name: context.repo.repo, number: pr.number }
              );
              for (const ref of repoData?.pullRequest?.closingIssuesReferences?.nodes ?? []) {
                const repo = ref.repository;
                if ((repo?.owner?.login ?? '').toLowerCase() === context.repo.owner.toLowerCase()
                  && (repo?.name ?? '').toLowerCase() === context.repo.repo.toLowerCase()) {
                  issues.push(ref);
                }
              }
            } catch (err) {
              // A broken query just warns.
              core.warning(`could not fetch the PR's closing issues: ${err.message}`);
            }

            for (const issue of issues) {
              try {
                if (issue.assignees.nodes.some((a) => a.login === author)) {
                  console.log(`Issue #${issue.number} is already assigned to ${author}. Skipping.`);
                  continue;
                }

                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [author]
                });
                console.log(`Assigned ${author} to issue #${issue.number}`);

              } catch (err) {
                core.warning(`could not assign ${author} to issue #${issue.number}: ${err.message}`);
              }
            }

            // Pull Requests - Assign the author only if the PR has no assignees
            if (pr.assignees?.length > 0) {
              console.log(`PR #${pr.number} already has assignees. Skipping.`);
            } else {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [author]
                });
                console.log(`Assigned ${author} to PR #${pr.number}`);
              } catch (err) {
                core.warning(`could not assign ${author} to PR #${pr.number}: ${err.message}`);
              }
            }
