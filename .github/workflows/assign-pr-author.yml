name: Auto Assign PR Author

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-author:
    runs-on: ubuntu-latest

    steps:
      - name: Assign PR author if no assignee exists
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Do not overwrite existing assignees
            if (pr.assignees?.length > 0) {
              console.log('PR already has assignees. Skipping.');
              return;
            }
            // Bot accounts cannot be assigned like regular contributors
            if (pr.user.type === 'Bot') {
              console.log(`PR author ${pr.user.login} is a bot. Skipping assignment.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login]
              });

              console.log(`Assigned ${pr.user.login} to PR #${pr.number}`);
            } catch (err) {
              // E.g. fork author is not a collaborator — don't fail the workflow
              console.log(`Warning: could not assign ${pr.user.login}: ${err.message}`);
            }
