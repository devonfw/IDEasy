name: Build native images

# Reusable build of all GraalVM native images, the Windows MSI, and the macOS PKG. Shared by
# release.yml (real release) and nightly-build.yml (SNAPSHOT release) so the OS matrix and the
# per-platform packaging are defined exactly once.
#
# It takes two distinct version values because the two callers need different ones:
#   - native_version: baked into the native images via -Drevision, so "ide -v" identifies the build.
#   - pkg_version:    passed to the macOS PKG installer, which reads RELEASE_VERSION from the env.
# release.yml passes release_version for both; nightly-build.yml passes build_version (native) and
# snapshot_version (PKG).
#
# It also takes a signing_policy so the SignPath signing (MSI and the Windows exe, see #2808) uses
# the right policy per caller: release.yml passes 'release-signing', nightly-build.yml passes
# 'test-signing'.

on:
  workflow_call:
    inputs:
      native_version:
        description: Version baked into the native images via -Drevision (e.g. release version, or date-suffixed snapshot).
        required: true
        type: string
      pkg_version:
        description: Version passed to the macOS PKG installer (build-pkg.sh reads RELEASE_VERSION from the env).
        required: true
        type: string
      signing_policy:
        description: SignPath signing policy used to sign the Windows MSI and exe (see #2808).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build native images
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: # ATTENTION: image names are referenced in cli/src/main/assembly/*.xml files - on update do not forget to also update there
        os: [ windows-latest, ubuntu-latest, ubuntu-22.04-arm, macos-latest, macos-15-intel ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'
      - name: Build native image
        shell: bash
        run: |
          cd cli
          mvn -B -ntp -Drevision=${NATIVE_VERSION} -Pnative -DskipTests=true package
        env:
          NATIVE_VERSION: ${{ inputs.native_version }}
      - name: Ad-hoc sign native image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --sign - cli/target/ideasy
          codesign --verify --verbose cli/target/ideasy
      # Sign the Windows native image (exe) before it is packaged so that the exe is signed both
      # inside the MSI and in the tar.gz / "natives" artifact - i.e. even when IDEasy is installed
      # without the MSI. The signed exe replaces the unsigned one, which the "Upload native image"
      # and "Build MSI" steps below then consume. (see #2808, parent of #2753)
      - name: Upload unsigned exe
        if: runner.os == 'Windows'
        id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: exe-unsigned
          path: cli/target/ideasy.exe
      - name: Sign exe
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '428e13ed-ca0c-47ca-8a73-63b76cabb59b'
          project-slug: 'IDEasy'
          signing-policy-slug: ${{ inputs.signing_policy }}
          artifact-configuration-slug: 'IDEasy.exe'
          github-artifact-id: '${{ steps.upload-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'cli/target/signed-exe'
      - name: Replace unsigned exe with signed exe
        if: runner.os == 'Windows'
        shell: bash
        run: cp -f cli/target/signed-exe/ideasy.exe cli/target/ideasy.exe
      - name: Upload native image
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.os }}
          path: cli/target/ideasy*
      - name: Build MSI with WixToolSet
        if: runner.os == 'Windows'
        shell: bash
        run: ./windows-installer/build-msi.sh
      - name: Upload unsigned MSI
        if: runner.os == 'Windows'
        id: upload-msi
        uses: actions/upload-artifact@v7
        with:
          name: msi-unsigned
          path: windows-installer/ideasy.msi
      - name: Sign MSI
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '428e13ed-ca0c-47ca-8a73-63b76cabb59b'
          project-slug: 'IDEasy'
          signing-policy-slug: ${{ inputs.signing_policy }}
          artifact-configuration-slug: 'IDEasy'
          github-artifact-id: '${{ steps.upload-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'windows-installer/signed'
      - name: Upload MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: msi
          path: windows-installer/signed/ideasy.msi

      - name: Build MacOS PKG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./macos-installer/build-pkg.sh
        env:
          RELEASE_VERSION: ${{ inputs.pkg_version }}
      - name: Upload unsigned PKG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.os == 'macos-latest' && 'arm64' || 'x64' }}
          path: macos-installer/ideasy.pkg
          # Default is "warn": a missing PKG would upload an empty artifact and only fail much
          # later in the deploy job. Fail right here instead.
          if-no-files-found: error
