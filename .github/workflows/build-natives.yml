# Builds the IDEasy native images for all supported OS types/architectures, signs the Windows
# exe/MSI with SignPath, packages the MSI (Wix) and the macOS PKG, and uploads every binary as a
# separate artifact for the caller's release/deploy job.
#
# This reusable workflow is the single source of truth shared by release.yml and
# nightly-build.yml, which previously duplicated this job almost verbatim (issue #2257). Each caller
# keeps its own version resolution and passes the value(s) it wants baked in via the inputs below.

name: Build Native Images

on:
  workflow_call:
    inputs:
      # Version baked into the native images so "ide -v" identifies the build. Each caller passes
      # its own resolved value: release.yml passes its release_version, nightly-build.yml passes its
      # date-suffixed build_version (the CLI upgrade logic relies on that format, see
      # IdeasyCommandlet.PATTERN_IDEASY_SNAPSHOT_VERSION).
      native_image_version:
        description: Version to build the native images with (-Drevision)
        required: true
        type: string
      # Version used when building the macOS PKG installer (build-pkg.sh). release.yml passes its
      # release_version, nightly-build.yml passes its snapshot_version.
      pkg_version:
        description: Version to build the macOS PKG installer with
        required: true
        type: string
      # SignPath signing policy applied to the Windows exe/MSI (test-signing or release-signing).
      # See documentation/signpath.adoc.
      signing_policy:
        description: 'SignPath signing policy (test-signing or release-signing)'
        required: true
        type: string

# A workflow_call job does not inherit the caller's permissions or secrets by default. Declare the
# permissions this job needs (id-token:write matches the existing SignPath setup) and have the
# callers forward secrets with 'secrets: inherit' (valid because this is a same-repo workflow).
permissions:
  contents: read
  id-token: write

jobs:
  build-natives:
    name: Build native images
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: # ATTENTION: image names are referenced in cli/src/main/assembly/*.xml files, on update do not forget to also update there. This workflow is shared by release.yml and nightly-build.yml.
        os: [ windows-latest, ubuntu-latest, ubuntu-22.04-arm, macos-latest, macos-15-intel ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'
      - name: Build native image
        shell: bash
        run: |
          cd cli
          # The JUnits are skipped on purpose: they already run in the CI build on main and in every
          # PR build. Repeating them for each of the five native image legs would only cost build
          # time without adding QA value (see #1215).
          mvn -B -ntp -Pnative -DskipTests=true -Drevision=${RELEASE_VERSION} package
        env:
          RELEASE_VERSION: ${{ inputs.native_image_version }}
      - name: Ad-hoc sign native image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --sign - cli/target/ideasy
          codesign --verify --verbose cli/target/ideasy
      # Sign the Windows native image (exe) before it is packaged so that the exe is signed both
      # inside the MSI and in the tar.gz / "natives" artifact - i.e. even when IDEasy is installed
      # without the MSI. The signed exe replaces the unsigned one, which the "Upload native image"
      # and "Build MSI" steps below then consume. (see #2808, parent of #2753)
      #
      # The signing policy is passed in by the calling workflow as the 'signing_policy' input. Both
      # callers expose it as a workflow_dispatch input (default: test-signing), so they double as a
      # cheap probe to verify that the release-signing policy signs green without triggering a real
      # release. See documentation/signpath.adoc.
      - name: Upload unsigned exe
        if: runner.os == 'Windows'
        id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: exe-unsigned
          path: cli/target/ideasy.exe
      - name: Sign exe
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '428e13ed-ca0c-47ca-8a73-63b76cabb59b'
          project-slug: 'IDEasy'
          signing-policy-slug: '${{ inputs.signing_policy }}'
          artifact-configuration-slug: 'IDEasy.exe'
          github-artifact-id: '${{ steps.upload-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'cli/target/signed-exe'
      - name: Replace unsigned exe with signed exe
        if: runner.os == 'Windows'
        shell: bash
        run: cp -f cli/target/signed-exe/ideasy.exe cli/target/ideasy.exe
      - name: Upload native image
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.os }}
          path: cli/target/ideasy*
      - name: Build MSI with WixToolSet
        if: runner.os == 'Windows'
        shell: bash
        run: ./windows-installer/build-msi.sh
      - name: Upload unsigned MSI
        if: runner.os == 'Windows'
        id: upload-msi
        uses: actions/upload-artifact@v7
        with:
          name: msi-unsigned
          path: windows-installer/ideasy.msi
      - name: Sign MSI
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '428e13ed-ca0c-47ca-8a73-63b76cabb59b'
          project-slug: 'IDEasy'
          signing-policy-slug: '${{ inputs.signing_policy }}'
          artifact-configuration-slug: 'IDEasy'
          github-artifact-id: '${{ steps.upload-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'windows-installer/signed'
      - name: Upload MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: msi
          path: windows-installer/signed/ideasy.msi
      - name: Build MacOS PKG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./macos-installer/build-pkg.sh
        env:
          RELEASE_VERSION: ${{ inputs.pkg_version }}
      - name: Upload unsigned PKG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os == 'macos-latest' && 'arm64' || 'x64' }}
          path: macos-installer/ideasy.pkg
          # Default is "warn": a missing PKG would upload an empty artifact and only fail much
          # later in the caller's release/deploy job. Fail right here instead.
          if-no-files-found: error
