name: Nightly Build (SNAPSHOT release)
on:
  workflow_dispatch:
    inputs:
      # Nightly uses the test-signing certificate by default. Selecting release-signing lets you
      # verify that the official release certificate (and its binding on the SignPath side) signs
      # green using this cheap, non-destructive workflow instead of triggering a real release -
      # the release.yml signing steps differ from these only by the policy slug (see
      # documentation/signpath.adoc, "Testing the release-signing policy without doing a release").
      signing_policy:
        description: 'SignPath signing policy applied to the Windows exe/MSI. Keep test-signing for a normal nightly; use release-signing only to verify the release certificate signs green.'
        type: choice
        default: 'test-signing'
        options: [ 'test-signing', 'release-signing' ]

permissions:
  contents: read
  id-token: write

jobs:
  # Resolves the versions exactly once, so that every downstream job refers to the same values:
  # - snapshot_version: plain version from .mvn/maven.config, used for the deployed Maven artifacts
  #   and the PKG installer.
  # - build_version: snapshot_version with a date suffix (e.g. 2026.08.001-08_07_11-SNAPSHOT),
  #   baked into the native images so "ide -v" identifies the nightly. The CLI upgrade logic
  #   (IdeasyCommandlet.PATTERN_IDEASY_SNAPSHOT_VERSION) relies on exactly this format.
  #   Resolving it here also guarantees all matrix legs share one timestamp instead of each
  #   computing its own (which could differ across an hour boundary).
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      snapshot_version: ${{ steps.resolve.outputs.snapshot_version }}
      build_version: ${{ steps.resolve.outputs.build_version }}
    steps:
      - uses: actions/checkout@v3
      - name: Resolve version from .mvn/maven.config
        id: resolve
        shell: bash
        run: |
          maven_config="$(cat .mvn/maven.config)"
          snapshot_version="${maven_config/#*-Drevision=}"
          snapshot_version="${snapshot_version/ */}"
          if [ -z "${snapshot_version}" ]; then
            echo "ERROR: could not resolve the snapshot version from .mvn/maven.config." >&2
            exit 1
          fi
          build_version="${snapshot_version/-SNAPSHOT/-$(date +%m_%d_%H)-SNAPSHOT}"
          echo "Releasing snapshot ${snapshot_version} (native build version ${build_version})"
          echo "snapshot_version=${snapshot_version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
  # Builds all native images, signs the Windows exe/MSI, packages the MSI/PKG and uploads each
  # binary as a separate artifact for the deploy job below. This logic used to live inline in both
  # release.yml and nightly-build.yml (issue #2257); it now lives once in the reusable
  # build-natives workflow. The date-suffixed build version is baked into the native images while the
  # plain snapshot version is used for the macOS PKG installer.
  build-natives:
    name: Build native images
    needs: resolve-version
    uses: ./.github/workflows/build-natives.yml
    with:
      native_image_version: ${{ needs.resolve-version.outputs.build_version }}
      pkg_version: ${{ needs.resolve-version.outputs.snapshot_version }}
      signing_policy: ${{ inputs.signing_policy }}
    secrets: inherit

  # Downloads all native image artifacts to cli/target and builds the project using assemblies for final deployment to OSSRH Nexus
  deploy:
    name: Build Project and Deploy
    needs: [ resolve-version, build-natives ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Download natives
        uses: actions/download-artifact@v8
        with:
          path: ./cli/target/
      - name: Build project and deploy to OSSRH nexus
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.snapshot_version }}
        # The JUnits are skipped on purpose, see the "Build native image" step above.
        run: mvn --settings .mvn/settings.xml -DskipTests=true -Darchetype.test.skip=true -Dgpg.skip=true -Dstyle.color=always -B -ntp -pl -:ide-macos-installer -Passembly,msi,pkg,deploy deploy
