name: Update quality status documents

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-quality-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate status documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f documentation/quality-status/quality-status*.adoc
          rm -rf documentation/quality-status/quality-status-images

          cd documentation/quality-status/src
          python generate_quality_status.py --owner devonfw --repo IDEasy --output-dir ..

      - name: Commit and push changes
        run: |
          git config --global user.email ${{ secrets.BUILD_USER_EMAIL }}
          git config --global user.name ${{ secrets.BUILD_USER }}

          git add -A documentation/quality-status

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          BRANCH="doc/quality-status-update"
          
          git checkout -B "$BRANCH"

          git commit -m "Update quality status documents"
          git push origin "$BRANCH" --force-with-lease

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.ACTION_PUSH_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head doc/quality-status-update \
            --title "Doc: update quality status documents" \
            --body "Automatically generated quality status update." \
          || echo "Pull request already exists"
